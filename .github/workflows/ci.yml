name: CI

on:
    pull_request:
    workflow_call:

permissions:
    contents: read

jobs:
    checks:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        env:
            CI: 'true'
            NX_DAEMON: 'false'
            DATABASE_URL: postgres://training:ci-only-password@localhost:5432/training
        services:
            postgres:
                image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
                env:
                    POSTGRES_DB: training
                    POSTGRES_USER: training
                    POSTGRES_PASSWORD: ci-only-password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U training -d training"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 20
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Create isolated test configuration
              run: node tools/setup-env.mjs
            - run: pnpm format:check
            - run: pnpm lint
            - run: pnpm typecheck
            - run: pnpm agents:check
            - run: pnpm test
            - run: pnpm build
