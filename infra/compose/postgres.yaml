services:
    postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        environment:
            POSTGRES_DB: training
            POSTGRES_USER: training
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env}
            IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Generate .env}
        volumes:
            - postgres-data:/var/lib/postgresql/data
            - ./infra/postgres/init-identity.sh:/docker-entrypoint-initdb.d/10-identity.sh:ro
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U training -d training']
            interval: 5s
            timeout: 3s
            retries: 20
        restart: unless-stopped
volumes:
    postgres-data:
