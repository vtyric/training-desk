name: training-service-desk
x-environment: &environment
    NODE_ENV: ${DOCKER_NODE_ENV:-development}
    BASE_URL: ${DOCKER_BASE_URL:-http://localhost:8080}
    DATABASE_URL: postgres://training:${POSTGRES_PASSWORD:?Generate .env}@postgres:5432/training
    ADMIN_TOKEN: ${ADMIN_TOKEN:?Generate .env}
    TEAM_API_TOKEN: ${TEAM_API_TOKEN:?Generate .env}
    CUSTOMER_API_TOKEN: ${CUSTOMER_API_TOKEN:?Generate .env}
    OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://localhost:8081/realms/training}
    OIDC_INTERNAL_ISSUER_URL: ${OIDC_INTERNAL_ISSUER_URL:-http://host.docker.internal:8081/realms/training}
    IDENTITY_DIRECTORY_CLIENT_SECRET: ${IDENTITY_DIRECTORY_CLIENT_SECRET:?Run node tools/setup-env.mjs --extend}
    IDENTITY_PUBLIC_URL: ${IDENTITY_PUBLIC_URL:-http://localhost:8081}
    WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:?Generate .env}
    SETTINGS_FILE: /data/settings/backend.json
services:
    migrate:
        build:
            context: .
            dockerfile: apps/service-desk/Dockerfile
            target: migrate
        environment: *environment
        depends_on:
            postgres:
                condition: service_healthy
        restart: 'no'
        init: true
    service-desk:
        build:
            context: .
            dockerfile: apps/service-desk/Dockerfile
            target: runtime
        environment: *environment
        ports:
            - '${DOCKER_BIND_ADDRESS:-127.0.0.1}:${DOCKER_HTTP_PORT:-8080}:3000'
        volumes:
            - service-desk-settings:/data/settings
        extra_hosts:
            - host.docker.internal:host-gateway
        depends_on:
            migrate:
                condition: service_completed_successfully
            postgres:
                condition: service_healthy
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    'fetch("http://127.0.0.1:3000/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
                ]
            interval: 5s
            timeout: 3s
            start_period: 15s
            retries: 12
        init: true
        read_only: true
        tmpfs:
            - /tmp:size=16m,mode=1777
        restart: unless-stopped
        stop_grace_period: 30s
volumes:
    service-desk-settings:
